name: WebCheck Action
description: GitHub Action for website health checks, redirects, TLS certificates, security headers, DNS, performance, and route monitoring with JSON reports and configurable CI failure policies.
author: mwakidenis
branding:
  icon: check-circle
  color: blue

inputs:
  url:
    description: 'Target URL to check (http or https)'
    required: true
  routes:
    description: 'Newline-separated list of routes to check (e.g. /health, /api/status)'
    required: false
    default: '/'
  expected-status-codes:
    description: 'Comma-separated list of expected HTTP status codes (e.g. 200, 204)'
    required: false
    default: '200'
  timeout:
    description: 'Total request timeout in seconds'
    required: false
    default: '10'
  connect-timeout:
    description: 'Connection timeout in seconds'
    required: false
    default: '5'
  max-redirects:
    description: 'Maximum number of redirects to follow'
    required: false
    default: '10'
  follow-redirects:
    description: 'Whether to follow HTTP redirects'
    required: false
    default: 'true'
  required-headers:
    description: 'Comma-separated list of required security header names (e.g. strict-transport-security, content-security-policy)'
    required: false
    default: ''
  certificate-warning-days:
    description: 'Days remaining until certificate expiry that triggers a warning'
    required: false
    default: '14'
  certificate-failure-days:
    description: 'Days remaining until certificate expiry that triggers a failure'
    required: false
    default: '7'
  allow-insecure-tls:
    description: 'Allow insecure TLS connections (self-signed certificates, etc.) for local testing only'
    required: false
    default: 'false'
  user-agent:
    description: 'Custom User-Agent header value'
    required: false
    default: ''
  max-response-size-kb:
    description: 'Maximum response body size in kilobytes'
    required: false
    default: '10'
  performance-threshold-ms:
    description: 'Maximum acceptable response time in milliseconds'
    required: false
    default: ''
  fail-on-http-error:
    description: 'Fail the action when HTTP status is not an expected code'
    required: false
    default: 'true'
  fail-on-redirect:
    description: 'Fail the action when a redirect is detected'
    required: false
    default: 'false'
  fail-on-missing-headers:
    description: 'Fail the action when a required security header is missing'
    required: false
    default: 'false'
  fail-on-tls-error:
    description: 'Fail the action when a TLS error is detected'
    required: false
    default: 'true'
  fail-on-certificate-expiry:
    description: 'Fail the action when the certificate is expired or within failure threshold'
    required: false
    default: 'true'
  fail-on-route-error:
    description: 'Fail the action when any configured route errors'
    required: false
    default: 'true'
  fail-on-insecure-cookies:
    description: 'Fail the action when cookies lack Secure/HttpOnly/SameSite flags'
    required: false
    default: 'true'
  fail-on-dangerous-cors:
    description: 'Fail the action when CORS policy is dangerous (wildcard origin with credentials)'
    required: false
    default: 'true'
  output-file:
    description: 'Path to write the JSON report'
    required: false
    default: 'webcheck-report.json'
  baseline-file:
    description: 'Optional path to a baseline JSON report for comparison'
    required: false
    default: ''

outputs:
  result:
    description: 'Overall scan result: passed or failed'
  report-path:
    description: 'Path to the generated JSON report file'
  findings-count:
    description: 'Total number of findings (warnings + errors)'
  dns-resolved:
    description: 'Whether DNS resolution succeeded'
  tls-secure:
    description: 'Whether TLS certificate is valid and authorized'
  performance-within-threshold:
    description: 'Whether response time is within the performance threshold'
  cookie-secure:
    description: 'Whether all cookies have Secure flag set'
  cors-safe:
    description: 'Whether CORS policy is safe (no wildcard origin with credentials)'

runs:
  using: node20
  main: dist/index.js
